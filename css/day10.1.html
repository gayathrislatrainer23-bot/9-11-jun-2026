<html lang="en">
<head>

    <title>Document</title>
    <style>
        html{
            font-size: 16px;
        }
        .main-container{

        .first-unit{

        }
        div{

            width: 200px; 
            /* 4. %: relative to  parent */
        }
        div p{
           font-size: 2em;
           width: 50%;
        }
.rem-unit{
    font-size: 2rem;
}
.box{
    background-color: brown;
    width: 5vw;
}

    </style>
</head>

        <div class="container">
            <p > tenetur numquam provident quibusdam,</p>
        </div>      
        <p class="rem-unit">hai</p>
        <body>

</html>
