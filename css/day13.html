<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .logo img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .navbar {
            height: 70px;
            background-color: black;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        .right-side {
            width: 20em;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .menu ul {
            display: flex;
            list-style: none;
             gap: 10px;

        }

        a {

            text-decoration: none;
            color: aliceblue;

        }
           button {
            background-color: #d92f11;
            color: rgb(239, 236, 237);
            padding: 12px 25px;
            margin: 20px;
            border-radius: 15px;
            cursor: pointer;
            /* border-color: rgb(239, 84, 18); */
            border: none;
            box-shadow: 2px 2px 2px rgb(46, 45, 45);
            transition: 1s;

        }

        button:hover {
            color: black;
            background-color: #ad4646;
            box-shadow: 15px 13px 13px gray;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="left-side">
            <div class="logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIeZB5_UmvJ5Mfhsax1Gv0phGEXjscWA0MryglmVAmiA&s=10"
                    alt="">
            </div>
        </div>
        <div class="right-side">
            <div class="menu">
                <ul>
                    <li><a href="">HOME</a></li>
                    <li><a href="">ABOUT</a></li>
                    <li><a href="">CONTACT</a></li>
                </ul>
            </div>
            <button>SignIn</button>
        </div>
    </div>

</body>

</html>
