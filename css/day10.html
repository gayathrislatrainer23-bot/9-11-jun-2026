<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOGLAkRCA8xwQTr_IObyy5I2OUSMszQhxsQg&s">
    <style>
        button {
            background-color: #d92f11;
            color: rgb(239, 236, 237);
            padding: 12px 25px;
            margin: 20px;
            border-radius: 15px;
            cursor: pointer;
            /* border-color: rgb(239, 84, 18); */
            border: none;
            box-shadow: 5px 3px 5px gray;
            transition: 1s;

        }

        button:hover {
            color: black;
            background-color: #ad4646;
            box-shadow: 15px 13px 13px gray;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <button>submit</button>
</body>

</html>
