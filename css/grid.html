<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            height: 100vh;
            width: 100vw;
            display: grid;
            grid-template-columns: 100px 1fr;
            grid-template-rows: 70px 60px 1fr 100px;
            grid-gap: 2px;
            grid-template-areas:
                'header header'
                'nav nav'
                'sidebar main'
                'footer footer';

        }

        header {
            background-color: rgb(191, 154, 154);
            color: white;
            grid-area: header;

        }

        nav {
            background-color: rgb(205, 220, 204);
            color: white;
            grid-area: nav;

        }

        .sidebar {
            background-color: rgb(202, 197, 225);
            color: white;
            grid-area: sidebar;


        }

        main {
            background-color: rgb(204, 198, 169);
            color: white;
            grid-area: main;

        }

        footer {
            background-color: rgb(24, 24, 24);
            color: white;
            grid-area: footer;
        }
        @media(max-width: 768px){
            
        header {
            background-color: rgb(214, 28, 28);
            color: white;
            grid-area: header;

        }
    }
    @media(min-width:800px){
         footer {
        background-color: rgb(52, 145, 202);
        color: white;
        grid-area: footer;
    }
    }
    </style>
</head>

<body>
    <div class="container">
        <header>
            header
        </header>
        <nav>
            navbar
        </nav>
        <div class="sidebar">
            sidebar
        </div>
        <main>
            main section
        </main>
        <footer>
            footer
        </footer>
    </div>
</body>

</html>
